<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 미세먼지</title>
<style>
  :root{
    --bg1:#0b1f3a; --bg2:#12466b; --bg3:#0e7c86;
    --glass:rgba(255,255,255,.12); --glass-b:rgba(255,255,255,.22);
    --ink:#f2fbff; --muted:#a9c9d6;
    --c-좋음:#38bdf8; --c-보통:#34d399; --c-나쁨:#fb923c; --c-매우나쁨:#f43f5e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh; color:var(--ink); line-height:1.6;
    font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    background-attachment:fixed; overflow-x:hidden;
  }
  /* 떠다니는 빛 */
  .orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.45;z-index:0;animation:float 14s ease-in-out infinite}
  .o1{width:380px;height:380px;background:#22d3ee;top:-80px;left:-80px}
  .o2{width:320px;height:320px;background:#a78bfa;bottom:-60px;right:-60px;animation-delay:-5s}
  .o3{width:240px;height:240px;background:#fb923c;top:40%;left:60%;opacity:.25;animation-delay:-9s}
  @keyframes float{50%{transform:translate(40px,30px) scale(1.12)}}
  main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:36px 5vw 70px}

  header h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.02em;
    background:linear-gradient(90deg,#fff,#7dd3fc,#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{color:var(--muted);margin-top:4px;font-size:.92rem}
  .flow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:.82rem}
  .flow span{padding:3px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(8px)}

  .glass{background:var(--glass);border:1px solid var(--glass-b);border-radius:22px;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 12px 40px rgba(0,0,0,.28)}

  /* 요약 */
  .hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding:26px;margin:26px 0}
  @media(max-width:640px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
  .ring{--p:0;--c:var(--c-보통);width:170px;height:170px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.14) 0);transition:.8s;
    box-shadow:0 0 40px color-mix(in srgb,var(--c) 55%,transparent)}
  .ring>div{width:134px;height:134px;border-radius:50%;background:#0b2a47;display:grid;place-items:center;text-align:center}
  .ring b{font-size:2.6rem;line-height:1}
  .ring small{display:block;color:var(--muted);font-size:.75rem}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;width:100%}
  .stat{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.08)}
  .stat small{color:var(--muted);font-size:.78rem}
  .stat b{display:block;font-size:1.35rem}

  .badge{display:inline-block;padding:2px 12px;border-radius:99px;font-size:.82rem;font-weight:700;color:#06202e}
  .좋음{background:var(--c-좋음)}.보통{background:var(--c-보통)}.나쁨{background:var(--c-나쁨)}.매우나쁨{background:var(--c-매우나쁨);color:#fff}

  /* 측정소 카드 */
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 12px}
  .toolbar h2{font-size:1.15rem}
  .toolbar small{color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
  .st{padding:18px;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s;animation:rise .6s both}
  .st:hover{transform:translateY(-6px);box-shadow:0 18px 50px rgba(0,0,0,.4)}
  .st::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
  @keyframes rise{from{opacity:0;transform:translateY(20px)}}
  .st h3{display:flex;justify-content:space-between;align-items:center;font-size:1.1rem}
  .st .time{color:var(--muted);font-size:.78rem}
  .big{font-size:2.4rem;font-weight:800;margin:6px 0 2px}
  .big small{font-size:.8rem;color:var(--muted);font-weight:400}
  .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin:6px 0 10px}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--c);transition:width 1s}
  .row{display:flex;justify-content:space-between;font-size:.88rem;color:var(--muted)}
  .btn{margin-top:14px;width:100%;padding:9px;border:0;border-radius:12px;cursor:pointer;font:inherit;font-weight:700;color:#06202e;
    background:linear-gradient(90deg,#7dd3fc,#a7f3d0);transition:filter .2s,transform .15s}
  .btn:hover{filter:brightness(1.1);transform:scale(1.02)}
  .btn:focus-visible{outline:3px solid #fde68a;outline-offset:2px}

  /* 예측 */
  .pred{padding:22px;margin-top:22px;animation:rise .5s both}
  .pred h3{margin-bottom:6px}
  .pred .num{font-size:2.4rem;font-weight:800}
  svg{width:100%;height:90px;margin-top:10px}
  .err{margin:14px 0;padding:12px 16px;border-radius:14px;background:rgba(244,63,94,.25);border:1px solid #f43f5e}
  .skeleton{height:150px;border-radius:22px;background:linear-gradient(90deg,var(--glass),rgba(255,255,255,.25),var(--glass));
    background-size:200% 100%;animation:sh 1.2s linear infinite}
  @keyframes sh{to{background-position:-200% 0}}
  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:.8rem}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<main>
  <header>
    <h1>🌋 제주 미세먼지</h1>
    <p>실시간 측정 · AI 1시간 뒤 예측</p>
    <div class="flow"><span>📡 공공데이터</span><span>→ ⚙️ FastAPI 가공</span><span>→ 🗄️ Supabase 저장</span><span>→ 🖥️ 결과만 표시</span></div>
  </header>

  <div id="err"></div>
  <section class="glass hero" id="hero"><div class="skeleton" style="width:100%"></div></section>

  <div class="toolbar"><h2>측정소별 현황</h2><small>API: <span id="api"></span> · <span id="upd"></span></small></div>
  <section class="grid" id="grid"></section>

  <section class="glass pred" id="pred" hidden></section>
  <footer>FastAPI + Railway + Supabase + Vercel · 60초마다 자동 새로고침</footer>
</main>

<script>
// 로컬(127.0.0.1/localhost)이면 로컬 서버, 배포(Vercel)이면 Railway 주소.
// 배포 전에 RAILWAY_URL 을 본인 Railway 주소로 바꾸세요 (끝에 / 없이).
const RAILWAY_URL = "https://YOUR-APP.up.railway.app";
const isLocal = ["localhost", "127.0.0.1"].includes(location.hostname);
const API = isLocal ? "http://127.0.0.1:8000" : RAILWAY_URL;
document.getElementById("api").textContent = API;

const $ = (id) => document.getElementById(id);
const COLOR = {좋음:"var(--c-좋음)",보통:"var(--c-보통)",나쁨:"var(--c-나쁨)",매우나쁨:"var(--c-매우나쁨)"};
const EMOJI = {좋음:"😄",보통:"🙂",나쁨:"😷",매우나쁨:"🚨"};
const badge = (g) => g ? `<span class="badge ${g}">${g}</span>` : "-";
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function get(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(path + " → " + r.status);
  return r.json();
}

async function load() {
  try {
    const [s, rows] = await Promise.all([get("/air/summary"), get("/air/latest")]);
    $("err").innerHTML = "";
    const g = s.avg_pm10_grade;
    $("hero").innerHTML = `
      <div class="ring" style="--p:${Math.min(100, (s.avg_pm10 ?? 0) / 1.5)};--c:${COLOR[g] || "var(--c-보통)"}">
        <div><span><b>${s.avg_pm10 ?? "-"}</b><small>평균 PM10 ㎍/㎥</small></span></div>
      </div>
      <div>
        <div style="font-size:1.5rem;font-weight:800">${EMOJI[g] || ""} 지금 제주는 ${badge(g)}</div>
        <div class="stats" style="margin-top:12px">
          <div class="stat"><small>측정소</small><b>${s.stations}곳</b></div>
          <div class="stat"><small>평균 PM2.5</small><b>${s.avg_pm25 ?? "-"}</b></div>
          <div class="stat"><small>가장 높은 곳</small><b>${s.worst_station ? esc(s.worst_station.station) + " " + s.worst_station.pm10 : "-"}</b></div>
          <div class="stat"><small>데이터</small><b>${s.mode === "demo" ? "연습" : "실시간"}</b></div>
        </div>
      </div>`;
    $("grid").innerHTML = rows.map((r, i) => `
      <article class="glass st" style="--c:${COLOR[r.pm10_grade] || "var(--c-보통)"};animation-delay:${i * 80}ms">
        <h3>${esc(r.station)} ${badge(r.pm10_grade)}</h3>
        <div class="time">🕒 ${esc(r.time)}</div>
        <div class="big">${r.pm10 ?? "-"} <small>PM10</small></div>
        <div class="bar"><i data-w="${Math.min(100, (r.pm10 ?? 0) / 1.5)}"></i></div>
        <div class="row"><span>초미세먼지 PM2.5</span><span><b>${r.pm25 ?? "-"}</b> ${badge(r.pm25_grade)}</span></div>
        <button class="btn" data-st="${esc(r.station)}">🔮 1시간 뒤 예측</button>
      </article>`).join("");
    requestAnimationFrame(() => document.querySelectorAll(".bar i").forEach(b => b.style.width = b.dataset.w + "%"));
    $("upd").textContent = "갱신 " + new Date().toLocaleTimeString("ko-KR");
  } catch (e) {
    $("err").innerHTML = `<div class="err">⚠️ 불러오기 실패: ${esc(e.message)}<br><small>백엔드(8000)가 켜져 있고 .env의 FRONT_ORIGINS가 이 주소와 같은지 확인하세요.</small></div>`;
  }
}

function spark(vals, next) {
  const all = [...vals, next], max = Math.max(...all), min = Math.min(...all), W = 600, H = 90;
  const x = i => (i / (all.length - 1)) * (W - 20) + 10;
  const y = v => H - 10 - ((v - min) / (max - min || 1)) * (H - 24);
  const pts = vals.map((v, i) => `${x(i)},${y(v)}`).join(" ");
  const last = vals.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="최근 PM10 추이와 예측">
    <polyline points="${pts}" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="${x(last)}" y1="${y(vals[last])}" x2="${x(last + 1)}" y2="${y(next)}" stroke="#fde68a" stroke-width="3" stroke-dasharray="6 6"/>
    <circle cx="${x(last + 1)}" cy="${y(next)}" r="7" fill="#fde68a"/></svg>`;
}

$("grid").addEventListener("click", async (e) => {
  const st = e.target.closest("[data-st]")?.dataset.st;
  if (!st) return;
  const box = $("pred"); box.hidden = false; box.innerHTML = '<div class="skeleton"></div>';
  box.scrollIntoView({behavior: "smooth", block: "center"});
  try {
    const p = await get("/air/predict?station=" + encodeURIComponent(st));
    box.innerHTML = p.ready
      ? `<h3>🔮 ${esc(p.station)} 1시간 뒤 예측</h3>
         <div class="num">${p.next_pm10} <small style="font-size:1rem">㎍/㎥</small> ${badge(p.next_grade)}</div>
         <small style="color:var(--muted)">평균 오차 ±${p.avg_error} · 최근 ${p.recent.length}시간 실제값(파랑) → 예측(노랑)</small>
         ${spark(p.recent, p.next_pm10)}`
      : `<h3>🔮 ${esc(p.station)}</h3><p>${esc(p.message)}</p>`;
  } catch (e2) { box.innerHTML = `<div class="err">${esc(e2.message)}</div>`; }
});

load();
setInterval(load, 60000);
</script>
</body>
</html>
